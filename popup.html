<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Request Monitor</title>
    <style>
      body { 
        font-family: Arial, sans-serif; 
        width: 480px; 
        margin: 12px; 
      }
      .row { 
        display: flex; 
        gap: 8px; 
        align-items: center; 
        margin-bottom: 10px; 
      }
      button { 
        padding: 6px 10px; 
        cursor: pointer; 
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
      }
      button:hover {
        background: #f5f5f5;
      }
      .logs { 
        max-height: 520px; 
        overflow: auto; 
        border: 1px solid #ddd; 
        padding: 8px; 
        border-radius: 8px;
        background: white;
      }
      .log { 
        border-bottom: 1px solid #eee; 
        padding: 12px 0; 
      }
      .log:last-child { 
        border-bottom: none; 
      }
      .meta { 
        font-size: 11px; 
        color: #777; 
      }
      .url { 
        font-size: 12px; 
        word-break: break-all; 
        color: #333;
        margin: 4px 0;
      }
      .badge { 
        display: inline-block; 
        padding: 2px 8px; 
        border-radius: 999px; 
        border: 1px solid #ddd; 
        font-size: 11px;
        background: #f0f0f0;
        font-weight: bold;
      }
      pre {
        font-family: 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <strong>🔍 Surveillance twitter</strong>
      <span class="badge" id="count">0</span>
      <button id="clear" style="margin-left:auto;">🗑️ Vider</button>
    </div>

    <div class="logs" id="logs"></div>

    <script src="popup.js"></script>
  </body>
</html>
